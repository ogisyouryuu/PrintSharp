name: npm Publish
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/preview/package-lock.json
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_TAG)) process.exit(1)'
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Check published version
        id: published
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --access public --provenance
        if: steps.published.outputs.exists != 'true'
