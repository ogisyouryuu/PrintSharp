name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore PrintSharp.slnx
      - run: dotnet build PrintSharp.slnx -c Release --no-restore
      - run: dotnet test PrintSharp.slnx -c Release --no-build
