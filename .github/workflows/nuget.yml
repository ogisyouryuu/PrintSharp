name: NuGet Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to mirror to GitHub Packages (for example, v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Validate release tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH: $tag"
          }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
      - run: dotnet restore PrintSharp.slnx
      - run: dotnet build PrintSharp.slnx -c Release --no-restore
      - run: dotnet test PrintSharp.slnx -c Release --no-build
      - name: Pack libraries
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/packages'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          $projects = @(
            'src/PrintSharp/PrintSharp.csproj',
            'src/PrintSharp.Excel/PrintSharp.Excel.csproj',
            'src/PrintSharp.Pdf/PrintSharp.Pdf.csproj',
            'src/PrintSharp.Windows/PrintSharp.Windows.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release --no-build --no-restore -p:PackageVersion=$version -p:PackageOutputPath=$output
            if ($LASTEXITCODE -ne 0) { throw "Packing failed: $project" }
          }
      - name: Validate packages and consumer restore
        run: python eng/validate-packages.py artifacts/packages ${{ steps.version.outputs.version }}
      - name: NuGet login (OIDC)
        if: github.event_name == 'push'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages
        if: github.event_name == 'push'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem -LiteralPath artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $($_.Name)" }
          }
      - name: Publish packages to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem -LiteralPath artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:GITHUB_TOKEN --source https://nuget.pkg.github.com/ogisyouryuu/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "GitHub Packages push failed: $($_.Name)" }
          }
